# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...

# NOTE: For monorepo plugin versioning, workflows or callers should pass
# PLUGIN_RELEASE_VERSION and PLUGIN_UI_VERSION from .neko/release.state.json.

builds:
  # Main CLI binary
  - id: neko-cli
    binary: neko-cli
    main: ./main.go
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    ldflags:
      - -s -w
      - -X github.com/nekoman-hq/neko-cli/pkg/version.Version={{ .Version }}
      - -X github.com/nekoman-hq/neko-cli/pkg/version.Commit={{ .Commit }}
      - -X github.com/nekoman-hq/neko-cli/pkg/version.Date={{ .Date }}
      - -X github.com/nekoman-hq/neko-cli/pkg/version.BuiltBy=goreleaser

  # Release plugin
  - id: plugin-release
    binary: plugin-release
    main: ./plugin/release/main.go
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    ldflags:
      - -s -w
      - -X github.com/nekoman-hq/neko-cli/plugin/release/pkg/metadata.Version={{ if index .Env "PLUGIN_RELEASE_VERSION" }}{{ .Env.PLUGIN_RELEASE_VERSION }}{{ else }}dev{{ end }}
      - -X github.com/nekoman-hq/neko-cli/plugin/release/pkg/metadata.GitCommit={{ .Commit }}
      - -X github.com/nekoman-hq/neko-cli/plugin/release/pkg/metadata.BuildDate={{ .Date }}

  # Ui plugin
  - id: plugin-ui
    binary: plugin-ui
    main: ./plugin/ui/main.go
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    ldflags:
      - -s -w
      - -X github.com/nekoman-hq/neko-cli/plugin/ui/pkg/metadata.Version={{ if index .Env "PLUGIN_UI_VERSION" }}{{ .Env.PLUGIN_UI_VERSION }}{{ else }}dev{{ end }}
      - -X github.com/nekoman-hq/neko-cli/plugin/ui/pkg/metadata.GitCommit={{ .Commit }}
      - -X github.com/nekoman-hq/neko-cli/plugin/ui/pkg/metadata.BuildDate={{ .Date }}

archives:
  # Main CLI archive
  - id: neko-cli
    ids:
      - neko-cli
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - none*

  # Release plugin archive
  - id: plugin-release
    ids:
      - plugin-release
    formats: [tar.gz]
    name_template: >-
      plugin-release_{{ if index .Env "PLUGIN_RELEASE_VERSION" }}{{ .Env.PLUGIN_RELEASE_VERSION }}{{ else }}dev{{ end }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - src: plugin/release/manifest.json
        strip_parent: true
    format_overrides:
      - goos: windows
        formats: [zip]

  - id: plugin-ui
    ids:
      - plugin-ui
    formats: [ tar.gz ]
    name_template: >-
      plugin-ui_{{ if index .Env "PLUGIN_UI_VERSION" }}{{ .Env.PLUGIN_UI_VERSION }}{{ else }}dev{{ end }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - src: plugin/ui/manifest.json
        strip_parent: true
    format_overrides:
      - goos: windows
        formats: [ zip ]

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
