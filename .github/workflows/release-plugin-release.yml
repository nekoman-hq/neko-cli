name: Release Plugin Release

on:
  workflow_dispatch:
    inputs:
      unit:
        required: true
        type: string
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
      release_sha:
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-plugin-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate-build-publish:
    name: Validate, build, and publish plugin-release
    runs-on: ubuntu-latest
    env:
      RELEASE_UNIT: ${{ inputs.unit }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      RELEASE_WORKFLOW: .github/workflows/release-plugin-release.yml
      GORELEASER_CONFIG: .goreleaser.plugin-release.yaml
    steps:
      - name: Validate dispatch inputs
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$RELEASE_UNIT" != "plugin-release" ]]; then
            echo "::error::unit must be plugin-release, got '$RELEASE_UNIT'"
            exit 1
          fi

          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must be a semver-like value, got '$RELEASE_VERSION'"
            exit 1
          fi

          expected_tag="plugin-release/v${RELEASE_VERSION}"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "::error::tag must be '${expected_tag}', got '$RELEASE_TAG'"
            exit 1
          fi

          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::release_sha must be a 40-character lowercase Git SHA"
            exit 1
          fi

          {
            echo "## plugin-release dispatch"
            echo ""
            echo "- unit: \`$RELEASE_UNIT\`"
            echo "- version: \`$RELEASE_VERSION\`"
            echo "- tag: \`$RELEASE_TAG\`"
            echo "- release_sha: \`$RELEASE_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout dispatched tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag and release SHA
        shell: bash
        run: |
          set -euo pipefail

          head_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-list -n 1 "$RELEASE_TAG")"

          if [[ "$head_sha" != "$RELEASE_SHA" ]]; then
            echo "::error::checked-out HEAD $head_sha does not match release_sha $RELEASE_SHA"
            exit 1
          fi

          if [[ "$tag_sha" != "$RELEASE_SHA" ]]; then
            echo "::error::tag $RELEASE_TAG points to $tag_sha, expected $RELEASE_SHA"
            exit 1
          fi

          echo "Tag and release_sha validation passed." >> "$GITHUB_STEP_SUMMARY"

      - name: Validate materialized release state
        shell: bash
        run: |
          set -euo pipefail

          if ! jq -e --arg version "$RELEASE_VERSION" '.units["plugin-release"].version == $version' .neko/release.state.json > /dev/null; then
            echo "::error::.neko/release.state.json must contain units.plugin-release.version == $RELEASE_VERSION"
            exit 1
          fi

          if ! jq -e --arg version "$RELEASE_VERSION" '.version == $version' plugin/release/manifest.json > /dev/null; then
            echo "::error::plugin/release/manifest.json must contain version == $RELEASE_VERSION"
            exit 1
          fi

          if ! jq -e --arg workflow "$RELEASE_WORKFLOW" '
            .schemaVersion == 2 and
            any(.units[]; .id == "plugin-release" and
              .tagPrefix == "plugin-release/v" and
              .executor.type == "goreleaser" and
              .executor.delivery == "github-actions" and
              .executor.workflow == $workflow)
          ' .neko/release.config.json > /dev/null; then
            echo "::error::.neko/release.config.json must define plugin-release with tagPrefix plugin-release/v, goreleaser, github-actions, and $RELEASE_WORKFLOW"
            exit 1
          fi

          echo "Repository version-file validation passed." >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go tests
        shell: bash
        run: |
          set -euo pipefail
          go test ./...

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check --config ${{ env.GORELEASER_CONFIG }}

      - name: Build plugin-release only
        uses: goreleaser/goreleaser-action@v6
        env:
          PLUGIN_RELEASE_VERSION: ${{ inputs.version }}
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --config ${{ env.GORELEASER_CONFIG }} --snapshot --clean --single-target

      - name: Verify tracked files were not modified
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          echo "Build validation completed without tracked file changes." >> "$GITHUB_STEP_SUMMARY"

      - name: Package plugin-release artifacts
        uses: goreleaser/goreleaser-action@v6
        env:
          PLUGIN_RELEASE_VERSION: ${{ inputs.version }}
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --config ${{ env.GORELEASER_CONFIG }} --snapshot --clean --skip=publish

      - name: Publish plugin-release GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh release create "$RELEASE_TAG" \
            dist/*.tar.gz \
            dist/*.zip \
            dist/*_checksums.txt \
            --target "$RELEASE_SHA" \
            --title "plugin-release $RELEASE_VERSION" \
            --notes "Release plugin-release $RELEASE_VERSION" \
            --verify-tag

      - name: Generate plugin registry index
        shell: bash
        env:
          INDEX_OUTPUT: ${{ runner.temp }}/plugin-index.json
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_UNIT: ${{ inputs.unit }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: .github/scripts/generate-plugin-index.sh

      - name: Publish plugin registry index
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          INDEX_PATH: ${{ runner.temp }}/plugin-index.json
          PLUGIN_REGISTRY_TARGET_SHA: ${{ inputs.release_sha }}
        run: .github/scripts/publish-plugin-index.sh

      - name: Publish summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo ""
            echo "## Publish status"
            echo ""
            echo "Published plugin-release artifacts for \`$RELEASE_TAG\` using \`$GORELEASER_CONFIG\`."
            echo "Published \`plugin-index.json\` to the mutable \`plugin-registry\` release."
          } >> "$GITHUB_STEP_SUMMARY"
