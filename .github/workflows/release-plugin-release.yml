name: Release Plugin Release

on:
  workflow_dispatch:
    inputs:
      unit:
        description: Neko Release V2 unit id
        required: true
        type: string
      version:
        description: Neko-authoritative release version
        required: true
        type: string
      tag:
        description: Neko-created unit tag
        required: true
        type: string
      release_sha:
        description: Neko-created release commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.unit }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate and build plugin-release
    runs-on: ubuntu-latest
    outputs:
      unit: ${{ steps.release-context.outputs.unit }}
      version: ${{ steps.release-context.outputs.version }}
      tag: ${{ steps.release-context.outputs.tag }}
      release_sha: ${{ steps.release-context.outputs.release_sha }}
    env:
      GORELEASER_CONFIG: .goreleaser.plugin-release.yaml
    steps:
      - name: Checkout the exact release commit with tags
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Validate immutable self-release identity
        shell: bash
        env:
          RELEASE_UNIT: ${{ inputs.unit }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail

          if [[ "$RELEASE_UNIT" != "plugin-release" ]]; then
            echo "::error::unit must be plugin-release, got '$RELEASE_UNIT'"
            exit 1
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must be a semver-like value, got '$RELEASE_VERSION'"
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "plugin-release/v${RELEASE_VERSION}" ]]; then
            echo "::error::tag must be plugin-release/v${RELEASE_VERSION}, got '$RELEASE_TAG'"
            exit 1
          fi
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::release_sha must be a 40-character lowercase Git SHA"
            exit 1
          fi

          head_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          if [[ "$head_sha" != "$RELEASE_SHA" || "$tag_sha" != "$RELEASE_SHA" ]]; then
            echo "::error::checkout, tag, and release_sha must identify the same commit"
            exit 1
          fi
          if ! jq -e --arg version "$RELEASE_VERSION" \
            '.units["plugin-release"].version == $version' .neko/release.state.json >/dev/null; then
            echo "::error::release state does not match version $RELEASE_VERSION"
            exit 1
          fi
          if ! jq -e --arg version "$RELEASE_VERSION" \
            '.version == $version' plugin/release/manifest.json >/dev/null; then
            echo "::error::release plugin manifest does not match version $RELEASE_VERSION"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build exact-commit Neko validation toolchain
        shell: bash
        env:
          NEKO_BIN_DIR: ${{ runner.temp }}/neko/bin
          NEKO_PLUGIN_DIR: ${{ runner.temp }}/neko/plugins
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail

          cli_version="$(jq -er '.units.cli.version' .neko/release.state.json)"
          release_plugin_dir="$NEKO_PLUGIN_DIR/release"
          mkdir -p "$NEKO_BIN_DIR" "$release_plugin_dir"

          go build -trimpath \
            -ldflags "-X github.com/nekoman-hq/neko-cli/pkg/version.Version=${cli_version} -X github.com/nekoman-hq/neko-cli/pkg/version.Commit=${RELEASE_SHA} -X github.com/nekoman-hq/neko-cli/pkg/version.BuiltBy=github-actions-self-release" \
            -o "$NEKO_BIN_DIR/neko" .
          go build -trimpath \
            -ldflags "-X github.com/nekoman-hq/neko-cli/plugin/release/pkg/metadata.Version=${RELEASE_VERSION} -X github.com/nekoman-hq/neko-cli/plugin/release/pkg/metadata.GitCommit=${RELEASE_SHA}" \
            -o "$release_plugin_dir/plugin-release" ./plugin/release
          cp plugin/release/manifest.json "$release_plugin_dir/manifest.json"

          echo "$NEKO_BIN_DIR" >> "$GITHUB_PATH"

      - name: Validate Neko release context
        id: release-context
        shell: bash
        env:
          NEKO_PLUGIN_DIR: ${{ runner.temp }}/neko/plugins
          RELEASE_UNIT: ${{ inputs.unit }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          neko release ci-validate-context \
            --unit "$RELEASE_UNIT" \
            --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" \
            --release-sha "$RELEASE_SHA" \
            --output github \
            --github-output-file "$GITHUB_OUTPUT"

      - name: Record validated release context
        shell: bash
        env:
          RELEASE_UNIT: ${{ steps.release-context.outputs.unit }}
          RELEASE_VERSION: ${{ steps.release-context.outputs.version }}
          RELEASE_TAG: ${{ steps.release-context.outputs.tag }}
          RELEASE_SHA: ${{ steps.release-context.outputs.release_sha }}
        run: |
          set -euo pipefail
          {
            echo "## Validated plugin-release dispatch"
            echo ""
            echo "- unit: \`$RELEASE_UNIT\`"
            echo "- version: \`$RELEASE_VERSION\`"
            echo "- tag: \`$RELEASE_TAG\`"
            echo "- release_sha: \`$RELEASE_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate materialized plugin manifest
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release-context.outputs.version }}
        run: |
          set -euo pipefail
          if ! jq -e --arg version "$RELEASE_VERSION" '.version == $version' plugin/release/manifest.json > /dev/null; then
            echo "::error::plugin/release/manifest.json must contain version == $RELEASE_VERSION"
            exit 1
          fi
          echo "Plugin manifest validation passed." >> "$GITHUB_STEP_SUMMARY"

      - name: Run Go tests
        shell: bash
        run: |
          set -euo pipefail
          go test ./...

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check --config ${{ env.GORELEASER_CONFIG }}

      - name: Build plugin-release only
        uses: goreleaser/goreleaser-action@v6
        env:
          PLUGIN_RELEASE_VERSION: ${{ steps.release-context.outputs.version }}
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --config ${{ env.GORELEASER_CONFIG }} --snapshot --clean --single-target

      - name: Verify tracked files were not modified
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          echo "Build validation completed without tracked file changes." >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish plugin-release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GORELEASER_CONFIG: .goreleaser.plugin-release.yaml
    steps:
      - name: Checkout the validated release commit with tags
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.release_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Package plugin-release artifacts
        uses: goreleaser/goreleaser-action@v6
        env:
          PLUGIN_RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --config ${{ env.GORELEASER_CONFIG }} --snapshot --clean --skip=publish

      - name: Publish plugin-release GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
        run: |
          set -euo pipefail

          gh release create "$RELEASE_TAG" \
            dist/*.tar.gz \
            dist/*.zip \
            dist/*_checksums.txt \
            --target "$RELEASE_SHA" \
            --title "plugin-release $RELEASE_VERSION" \
            --notes "Release plugin-release $RELEASE_VERSION" \
            --verify-tag

      - name: Generate plugin registry index
        shell: bash
        env:
          INDEX_OUTPUT: ${{ runner.temp }}/plugin-index.json
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_UNIT: ${{ needs.validate.outputs.unit }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: .github/scripts/generate-plugin-index.sh

      - name: Publish plugin registry index
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          INDEX_PATH: ${{ runner.temp }}/plugin-index.json
          PLUGIN_REGISTRY_TARGET_SHA: ${{ needs.validate.outputs.release_sha }}
        run: .github/scripts/publish-plugin-index.sh

      - name: Publish summary
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          {
            echo ""
            echo "## Publish status"
            echo ""
            echo "Published plugin-release artifacts for \`$RELEASE_TAG\` using \`$GORELEASER_CONFIG\`."
            echo "Published \`plugin-index.json\` to the mutable \`plugin-registry\` release."
          } >> "$GITHUB_STEP_SUMMARY"
