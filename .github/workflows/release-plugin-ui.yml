name: Release Plugin UI

on:
  workflow_dispatch:
    inputs:
      unit:
        description: Neko Release V2 unit id
        required: true
        type: string
      version:
        description: Neko-authoritative release version
        required: true
        type: string
      tag:
        description: Neko-created unit tag
        required: true
        type: string
      release_sha:
        description: Neko-created release commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.unit }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate and build plugin-ui
    runs-on: ubuntu-latest
    outputs:
      unit: ${{ steps.release-context.outputs.unit }}
      version: ${{ steps.release-context.outputs.version }}
      tag: ${{ steps.release-context.outputs.tag }}
      release_sha: ${{ steps.release-context.outputs.release_sha }}
    env:
      GORELEASER_CONFIG: .goreleaser.plugin-ui.yaml
    steps:
      - name: Checkout the exact release commit with tags
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Install pinned Neko CLI
        shell: bash
        env:
          NEKO_VERSION: ${{ vars.NEKO_VERSION }}
          NEKO_INSTALL_DIR: ${{ runner.temp }}/neko/bin
        run: |
          set -euo pipefail
          : "${NEKO_VERSION:?Set repository variable NEKO_VERSION to a supported Neko CLI version}"
          curl -fsSL https://raw.githubusercontent.com/nekoman-hq/neko-cli/main/install.sh \
            --output "$RUNNER_TEMP/install-neko.sh"
          bash "$RUNNER_TEMP/install-neko.sh"
          echo "$NEKO_INSTALL_DIR" >> "$GITHUB_PATH"

      - name: Install pinned Neko Release Plugin
        shell: bash
        env:
          NEKO_RELEASE_PLUGIN_VERSION: ${{ vars.NEKO_RELEASE_PLUGIN_VERSION }}
        run: |
          set -euo pipefail
          : "${NEKO_RELEASE_PLUGIN_VERSION:?Set repository variable NEKO_RELEASE_PLUGIN_VERSION to a supported Release Plugin version}"
          neko plugin install release --version "$NEKO_RELEASE_PLUGIN_VERSION"

      - name: Validate Neko release context
        id: release-context
        shell: bash
        env:
          RELEASE_UNIT: ${{ inputs.unit }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          neko release ci-validate-context \
            --unit "$RELEASE_UNIT" \
            --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" \
            --release-sha "$RELEASE_SHA" \
            --output github \
            --github-output-file "$GITHUB_OUTPUT"

      - name: Record validated release context
        shell: bash
        env:
          RELEASE_UNIT: ${{ steps.release-context.outputs.unit }}
          RELEASE_VERSION: ${{ steps.release-context.outputs.version }}
          RELEASE_TAG: ${{ steps.release-context.outputs.tag }}
          RELEASE_SHA: ${{ steps.release-context.outputs.release_sha }}
        run: |
          set -euo pipefail
          {
            echo "## Validated plugin-ui dispatch"
            echo ""
            echo "- unit: \`$RELEASE_UNIT\`"
            echo "- version: \`$RELEASE_VERSION\`"
            echo "- tag: \`$RELEASE_TAG\`"
            echo "- release_sha: \`$RELEASE_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate materialized plugin manifest
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release-context.outputs.version }}
        run: |
          set -euo pipefail
          jq -e --arg version "$RELEASE_VERSION" '.version == $version' plugin/ui/manifest.json > /dev/null

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go tests
        shell: bash
        run: |
          set -euo pipefail
          go test ./...

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check --config ${{ env.GORELEASER_CONFIG }}

      - name: Snapshot build plugin-ui only
        uses: goreleaser/goreleaser-action@v6
        env:
          PLUGIN_UI_VERSION: ${{ steps.release-context.outputs.version }}
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --config ${{ env.GORELEASER_CONFIG }} --snapshot --clean --single-target

      - name: Verify tracked files were not modified
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code

  publish:
    name: Publish plugin-ui
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GORELEASER_CONFIG: .goreleaser.plugin-ui.yaml
    steps:
      - name: Checkout the validated release commit with tags
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.release_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Package plugin-ui artifacts
        uses: goreleaser/goreleaser-action@v6
        env:
          PLUGIN_UI_VERSION: ${{ needs.validate.outputs.version }}
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --config ${{ env.GORELEASER_CONFIG }} --snapshot --clean --skip=publish

      - name: Publish plugin-ui GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
        run: |
          set -euo pipefail

          gh release create "$RELEASE_TAG" \
            dist/*.tar.gz \
            dist/*.zip \
            dist/*_checksums.txt \
            --target "$RELEASE_SHA" \
            --title "plugin-ui $RELEASE_VERSION" \
            --notes "Release plugin-ui $RELEASE_VERSION" \
            --verify-tag

      - name: Generate plugin registry index
        shell: bash
        env:
          INDEX_OUTPUT: ${{ runner.temp }}/plugin-index.json
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_UNIT: ${{ needs.validate.outputs.unit }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: .github/scripts/generate-plugin-index.sh

      - name: Publish plugin registry index
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          INDEX_PATH: ${{ runner.temp }}/plugin-index.json
          PLUGIN_REGISTRY_TARGET_SHA: ${{ needs.validate.outputs.release_sha }}
        run: .github/scripts/publish-plugin-index.sh

      - name: Publish summary
        shell: bash
        env:
          RELEASE_UNIT: ${{ needs.validate.outputs.unit }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
        run: |
          set -euo pipefail
          {
            echo "## plugin-ui release"
            echo ""
            echo "- unit: \`$RELEASE_UNIT\`"
            echo "- version: \`$RELEASE_VERSION\`"
            echo "- tag: \`$RELEASE_TAG\`"
            echo "- release_sha: \`$RELEASE_SHA\`"
            echo "- goreleaser_config: \`$GORELEASER_CONFIG\`"
            echo "- plugin_registry: \`plugin-index.json\` published to \`plugin-registry\`"
          } >> "$GITHUB_STEP_SUMMARY"
