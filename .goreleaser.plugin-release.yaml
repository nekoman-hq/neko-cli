# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Dedicated release config for the V2 plugin-release unit.
# It intentionally contains only the release plugin build and archive.

version: 2

project_name: plugin-release

builds:
  - id: plugin-release
    binary: plugin-release
    main: ./plugin/release
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    ldflags:
      - -s -w
      - -X github.com/nekoman-hq/neko-cli/plugin/release/pkg/metadata.Version={{ if index .Env "PLUGIN_RELEASE_VERSION" }}{{ .Env.PLUGIN_RELEASE_VERSION }}{{ else }}{{ .Version }}{{ end }}
      - -X github.com/nekoman-hq/neko-cli/plugin/release/pkg/metadata.GitCommit={{ .Commit }}
      - -X github.com/nekoman-hq/neko-cli/plugin/release/pkg/metadata.BuildDate={{ .Date }}

archives:
  - id: plugin-release
    ids:
      - plugin-release
    formats: [tar.gz]
    name_template: >-
      plugin-release_{{ if index .Env "PLUGIN_RELEASE_VERSION" }}{{ .Env.PLUGIN_RELEASE_VERSION }}{{ else }}{{ .Version }}{{ end }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - src: plugin/release/manifest.json
        strip_parent: true
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "plugin-release_{{ if index .Env \"PLUGIN_RELEASE_VERSION\" }}{{ .Env.PLUGIN_RELEASE_VERSION }}{{ else }}{{ .Version }}{{ end }}_checksums.txt"

changelog:
  disable: true

release:
  ids:
    - plugin-release
  name_template: "plugin-release {{ if index .Env \"PLUGIN_RELEASE_VERSION\" }}{{ .Env.PLUGIN_RELEASE_VERSION }}{{ else }}{{ .Version }}{{ end }}"
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
